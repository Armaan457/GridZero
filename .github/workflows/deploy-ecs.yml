name: Deploy to AWS ECS

on:
  push:
    branches:
      - main
    paths:
      - 'ML-Engine/**'
      - 'Simulation Engine/**'
      - '.github/workflows/deploy-ecs.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: p2p-ecs-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: p2p-ml-engine
            dir: ML-Engine
            task_def: ML-Engine/aws/ecs-task-definition.json
          - name: p2p-simulation-engine
            dir: Simulation Engine
            task_def: Simulation Engine/aws/ecs-task-definition.json

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr

      - name: Build, tag, and push Docker image
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --file "${{ matrix.service.dir }}/Dockerfile" \
            --tag "$ECR_REGISTRY/${{ matrix.service.name }}:$IMAGE_TAG" \
            --tag "$ECR_REGISTRY/${{ matrix.service.name }}:latest" \
            --push \
            "${{ matrix.service.dir }}"

          echo "image=$ECR_REGISTRY/${{ matrix.service.name }}:$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Inject Secrets Manager ARN
        env:
          SECRET_ARN: ${{ vars.FRIENDS_SECRET_ARN }}
        run: |
          set -euo pipefail
          test -n "$SECRET_ARN" || { echo "FRIENDS_SECRET_ARN missing"; exit 1; }
          jq --arg arn "$SECRET_ARN" --arg name "${{ matrix.service.name }}" '
            .containerDefinitions |= map(
              if .name == $name then
                .secrets |= map(
                  .valueFrom |= sub("^FRIENDS_SECRET_ARN"; $arn)
                )
              else .
              end
            )
          ' "${{ matrix.service.task_def }}" > "$RUNNER_TEMP/ecs-task-definition.json"

      - uses: aws-actions/amazon-ecs-render-task-definition@v1
        id: task-def
        with:
          task-definition: ${{ runner.temp }}/ecs-task-definition.json
          container-name: ${{ matrix.service.name }}
          image: ${{ steps.build-image.outputs.image }}

      - uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ matrix.service.name }}-service
          cluster: p2p-cluster
          wait-for-service-stability: true
